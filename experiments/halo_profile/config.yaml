
#config matter power spectrum
z: 0

m_min: 1e3
N_m: 32 #power of 2

M_min: 1e3
M_max: 1e16
N_M: 64 #power of 2

k_min: 1e-1
k_max: 1e4
N_k: 32 #power of 2


# config convergence power spectrum
z_min: 0
z_max: 2
N_z: 6    #amount of redshift points to sample from
l_min: 1e1
l_max: 1e6
N_l: 256  #Number of points along l used for interpolation

# xi correlation
theta_min: 1 # minimum angular scale for xi+ (in arcsecs)
theta_max: 1e3 # maximum angular scale for xi+ (in arcsecs)
N_theta: 10 # number of theta bins

# Cosmology parameters 
cosmo_params:
  flat: true
  H0: 70
  Om0: 0.2793
  Ob0: 0.0463
  sigma8: 0.821
  ns: 0.972


models:
  gas_profile: gassiegel2025      # gassiegel2025 | gasdebackere2022
  star_profile: starsiegel2025         # pointmass | starsiegel2025 
  shmr: moster2013                    # moster2013 | niemiec2022
  shmr_centrals: moster2013centrals   # moster2013centrals
 

params:

  profile:

    pointmass:

    gassiegel2025:
      logM_c: 13.6
      theta_ej: 6
      mu: 0.9
      gamma: 2
      delta: 8

    gasdebackere2022:
      gamma: 3         # 0 <= gamma <= 3
      logM_t: 13.0       # turnover mass of f_gas,500c
      alpha_t: 0.5       # sharpness of the turnover
      rc_frac: 0.1       # core radius in units of r500c
      beta: 0.7
    
    starsiegel2025:
      r_star: 0.015 # radius of galaxies times r200

    
  shmr:
    moster2013:
    moster2013centrals:
    niemiec2022:
  

logM_gaslimit: 10

# factor multiplicator for concentration of clumps
Q: 1.33

# clump distribution concentration
D: 1

# halo mass function parameters
logM0: 9 
alpha: 0

#clump mass function parameters
logm0: 9
beta: 0

massdef: "200c" # !! SHOULD LEAVE THIS BY DEFAULT ON 200c

# max number of processes
processes: 1


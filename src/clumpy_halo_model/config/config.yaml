# Single source of defaults for Config. Every key must be present here.
# User YAML files are layered on top of this one, so they only list what differs.

# --- matter power spectrum ---
z: 0

m_min: 1e3
N_m: 64            # power of 2

M_min: 1e3
M_max: 1e16
N_M: 256           # power of 2

k_min: 1e-1
k_max: 1e4
N_k: 64            # power of 2

massdef: "200c"    

# --- model selection: one entry per component ---
models:
  gas_profile: siegel2025          # siegel2025 | debackere2022

# --- model parameters: params.<component>.<model>; only the selected model is used ---
params:
  gas_profile:
    siegel2025:
      logM_c: 13.6
      theta_ej: 6
      mu: 0.9
      gamma: 2
      delta: 8
    debackere2022:
      gamma: 1.5         # 0 <= gamma <= 3
      logM_t: 13.0       # turnover mass of f_gas,500c
      alpha_t: 0.5       # sharpness of the turnover
      rc_frac: 0.1       # core radius in units of r500c
      beta_gas: 0.7

# shared by all gas models
logM_gaslimit: 10

# factor multiplicator for concentration of clumps
Q: 1.33
# clump distribution concentration
D: 1

# --- stellar profile ---
r_star: 0.015      # radius of galaxies times r200

# --- SHMR ---
S: 1               # factor before stellar fraction # THIS DOESNT WORK YET POWER GETS TAKEN AWAY AT LARGE SCALES

# --- convergence power spectrum ---
z_min: 0
z_max: 2
N_z: 6             # amount of redshift points to sample from
z_sources: 2
l_min: 1e1
l_max: 1e6
N_l: 256           # number of points along l used for interpolation

# --- xi correlation ---
theta_min: 1       # minimum angular scale for xi+ (in arcsecs)
theta_max: 1e3     # maximum angular scale for xi+ (in arcsecs)
N_theta: 10        # number of theta bins

# --- halo mass function parameters ---
logM0: 9
alpha: 0

# --- clump mass function parameters ---
logm0: 9
beta: 0

# --- numerics ---
integration_method: romb   # romb (fixed grid) | quad (adaptive)
epsrel: 1e-4
processes: 16              # max number of processes; 1 disables multiprocessing

# --- cosmology ---
cosmo_params:
  flat: true
  H0: 70
  Om0: 0.2793
  Ob0: 0.0463
  sigma8: 0.821
  ns: 0.972